# cargo-deny 0.20.2 policy (architecture section 2, DEC-015).
# Exceptions need a recorded owner decision; do not widen these lists to pass CI.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Unmaintained crates are reported; only direct dependencies fail the check.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"BSL-1.0",
	# Reviewed 2026-10-24: MIT without the attribution clause (encase via bevy_render); more permissive than MIT.
	"MIT-0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false and the project license is undecided (DEC-010).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
