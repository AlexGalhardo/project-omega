name: release

# Builds the Windows release when a version tag is pushed, following the owner's
# release pattern (DEC-016, docs/release.md): notes come from the matching
# CHANGELOG.md section; assets are the Windows archive, its SBOM (syft),
# checksums.txt, the cosign keyless bundle of checksums.txt and a build
# provenance attestation.
#
# workflow_dispatch takes the version to build, because GitHub creates no push
# event when more than three tags go up in a single push. Push version tags one
# at a time, and recover a tag that went up without a run by dispatching it here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (vX.Y.Z). The tag must already be pushed."
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_VERSION:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::not a version tag: $tag"
              exit 1
              ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Check the manifest version matches the tag
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "::error::Cargo.toml version is not $VERSION"; exit 1; }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release --locked -p omega_game --bins
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $name = "project-omega_${env:VERSION}_windows_amd64"
          New-Item -ItemType Directory -Force "dist/$name/assets" | Out-Null
          Copy-Item target/release/omega-game.exe, target/release/omega-content.exe, target/release/omega-sim.exe "dist/$name/"
          Copy-Item -Recurse assets/presentation, assets/generated "dist/$name/assets/"
          Copy-Item README.md, CHANGELOG.md "dist/$name/"
          Copy-Item engine/bevy/bevy/LICENSE-MIT "dist/$name/LICENSE-BEVY-MIT"
          Copy-Item engine/bevy/bevy/LICENSE-APACHE "dist/$name/LICENSE-BEVY-APACHE"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-archive
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-archive
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: SBOM per archive
        run: |
          set -euo pipefail
          for zip in dist/*.zip; do
            # The archive holds compiled binaries; the Cargo.lock graph is the
            # authoritative dependency inventory for them.
            syft scan dir:. --source-name "$(basename "$zip")" -o "spdx-json=${zip}.sbom.json"
          done
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.zip *.sbom.json > checksums.txt
          cat checksums.txt
      - name: Sign the checksums (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob checksums.txt --bundle checksums.txt.sigstore.json --yes
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$VERSION" > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/project-omega.intoto.jsonl
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag \
            dist/*.zip dist/*.sbom.json dist/checksums.txt dist/checksums.txt.sigstore.json dist/project-omega.intoto.jsonl
