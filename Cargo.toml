[workspace]
resolver = "3"
members = ["crates/omega_2d", "crates/omega_game"]
exclude = ["engine"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
repository = "https://github.com/AlexGalhardo/project-omega"

[workspace.dependencies]
# Exact pins: architecture section 2 and DEC-015. Bevy default features stay off;
# each crate opts into the headless core or the client profile.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded", "bevy_state"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rand_chacha = "=0.10.0"
sha2 = "=0.11.1"
omega_2d = { path = "crates/omega_2d" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
# Dependencies (Bevy) compile optimized so native debug runs are usable;
# game crates keep fast incremental debug builds.
opt-level = 2

[patch.crates-io]
# Vendored Bevy 0.20.0 fork (DEC-018): crates.io sources of upstream commit
# b3bdd75becaffe9a16677cf5bae5bd6d198f052b, edited in place. Patch log: engine/README.md.
